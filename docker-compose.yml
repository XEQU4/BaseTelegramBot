version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  test:
    build: .
    command: ["pytest", "tests/"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
